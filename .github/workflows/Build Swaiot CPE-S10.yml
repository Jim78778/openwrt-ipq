name: Build Swaiot CPE-S10 OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - swaiot-s10

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/Jim78778/openwrt-ipq.git
  REPO_BRANCH: swaiot-s10
  CONFIG_FILE: ci.config
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # 1. Checkout 源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_URL }}
          ref: ${{ env.REPO_BRANCH }}
          fetch-depth: 0

      # 2. 设置时区
      - name: Set timezone
        run: sudo timedatectl set-timezone "$TZ"

      # 3. 安装 OpenWrt 官方推荐依赖
      - name: Install official dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            binutils \
            bzip2 \
            diffutils \
            findutils \
            flex \
            gawk \
            gcc \
            getopt \
            grep \
            make \
            libc6-dev \
            zlib1g-dev \
            perl \
            python3 \
            rsync \
            subversion \
            unzip \
            which

      # 4. 更新 feeds
      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 拷贝配置文件或默认配置
      - name: Apply config
        run: |
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" .config
          else
            make defconfig
          fi

      # 6. 编译
      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      # 7. 上传固件产物
      - name: Upload firmware
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: bin/targets/
