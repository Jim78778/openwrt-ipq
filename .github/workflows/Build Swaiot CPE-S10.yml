name: Build Swaiot CPE-S10 (ipq807x NSS)

on:
  workflow_dispatch:
  push:
    branches:
      - swaiot-s10

env:
  TZ: Asia/Shanghai
  REPO_URL: https://github.com/qosmio/openwrt-ipq.git
  REPO_BRANCH: main-nss
  CONFIG_FILE: ci.config
  FEEDS_CONF: feeds.conf.default
  UPLOAD_FIRMWARE: true
  OPENWRT_DIR: /mnt/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # ==================================================
    # 1. Checkout workflow repo（ci.config / feeds）
    # ==================================================
    - name: Checkout workflow repo
      uses: actions/checkout@v4

    
    # ==================================================
    # 3. Set timezone
    # ==================================================
    - name: Set timezone
      run: sudo timedatectl set-timezone "$TZ"

   

    # ==================================================
    # 9. Load ci.config
    # ==================================================
    - name: Load ci.config
      run: |
        cd $OPENWRT_DIR
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig

    - name: Debug NSS config
      run: |
        cd $OPENWRT_DIR
        echo "===== NSS / qca-nss config ====="
        grep -E "NSS|qca-nss" .config || true
